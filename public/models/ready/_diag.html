<!DOCTYPE html><html><body>
<pre id="out">...</pre>
<script>
const out = document.getElementById('out');
const url = 'furniture/furniture_bookcase.glb';
fetch(url).then(r => {
  out.textContent = 'status=' + r.status + ' type=' + r.headers.get('content-type') + ' len=' + (r.headers.get('content-length')||'?');
  return r.text();
}).then(t => {
  out.textContent += '\nfirst120=' + JSON.stringify(t.slice(0,120));
}).catch(e => out.textContent = 'ERR ' + e);
</script></body></html>
